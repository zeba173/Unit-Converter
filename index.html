<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Unit Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Imperial Converter</h1>
                <p>Convert imperial units quickly and accurately</p>
            </div>
        </header>
        <section>
            <h2>Convert Units</h2>
            <div>
                <input type="text" id="input-el">
                <button type="button" onclick="unitConverter()">Convert</button>
            </div>
            <div>
                <p>Length (Meter/Feet)</p>
                <p id="length"></p>
            </div>     
            <div>
                <p>Volume (Liters/Gallons)</p>
                <p id="volume"></p>
            </div> 
            <div>
                <p>Mass (Kilograms/Pounds)</p>
                <p id="mass"></p>
            </div>       
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
