<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Unit Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Imperial Converter</h1>
                <p>Convert imperial units quickly and accurately</p>
            </div>
        </header>
        <section>
            <h2>Convert Units</h2>
            <div>
                <label for="category">Category</label>
                <select name="ctg" id="category">
                    <option value="length">Length</option>
                    <option value="weight">Weight</option>
                    <option value="volume">Volume</option>
                    <option value="temperature">Temperature</option>
                    <option value="area">Area</option>
                </select>
            </div>
            <div>
                <label for="value">Value</label>
                <input type="number" id="value" inputmode="decimal" placeholder="Enter number" value="1"/>
            </div>
            <div>
                <label for="fromUnit">From</label>
                <select id="fromUnit"></select>
            </div>
            <div>
                <label for="toUnit">To</label>
                <select id="toUnit"></select>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
